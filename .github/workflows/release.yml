name: release

# Publishes growthmap to npm with provenance, through npm trusted publishing (OIDC): no token is
# stored anywhere. The trusted publisher must name this repository and this workflow file.
# The first publish of the name cannot use OIDC (npm needs the package to exist first), so that
# job skips green and points at docs/release.md until the owner publishes once by hand.
#
# The release job beside it needs no account at all: it attaches the packed tarball to a GitHub
# release for this version, so the install command works for a stranger today.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Two merges in a row must never publish at once; a queued run waits (no cancel).
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The npm job below keeps its own permissions; this job only needs to write a release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # The asset name is fixed so releases/latest/download/growthmap.tgz always installs the
      # newest build. The release notes carry the install lines, verbatim, because a reader
      # copies them; npm 12 refuses a remote tarball without --allow-remote=all.
      - name: Attach the tarball to this version's GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: |
            Install growthmap from this release. No account is needed.

            ```sh
            npm install -g --allow-remote=all https://github.com/umeranjum17/growthmap/releases/latest/download/growthmap.tgz
            growthmap doctor
            growthmap sources
            growthmap run example.com --out report
            ```

            `--allow-remote=all` is required: npm 12 refuses to install a remote tarball URL
            without it. growthmap has no dependencies, so no `--allow-scripts` is needed.
        run: |
          set -eu
          tag="v$(node -p 'require("./package.json").version')"

          # Idempotent: a release that already carries the asset is done, and this stays green.
          if gh release view "$tag" --json assets --jq 'any(.assets[]; .name == "growthmap.tgz")' 2>/dev/null | grep -qx true; then
            echo "$tag already carries growthmap.tgz; nothing to do"
            exit 0
          fi

          npm pack
          mv growthmap-*.tgz growthmap.tgz

          if gh release view "$tag" >/dev/null 2>&1; then
            # The release exists but is missing the asset: upload it, never clobber over one.
            gh release upload "$tag" growthmap.tgz
          else
            gh release create "$tag" growthmap.tgz \
              --target "$GITHUB_SHA" \
              --title "growthmap $tag" \
              --notes "$NOTES"
          fi

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.0 or newer; the runner's bundled npm can be older.
      - name: Install a new enough npm
        run: |
          npm install -g npm@latest
          npm_version=$(npm -v)
          echo "npm $npm_version"
          if [ "$(printf '%s\n11.5.0\n' "$npm_version" | sort -V | head -n1)" != "11.5.0" ]; then
            echo "::error::npm $npm_version is older than 11.5.0, which trusted publishing needs"
            exit 1
          fi
      # No dependencies and no lockfile, so there is nothing to install.
      - name: Publish if this version is not on npm
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')

          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
            echo "$name@$version is already on npm; skipping publish"
            exit 0
          fi

          # A package must exist before a trusted publisher can be attached to it, so the very
          # first publish is the owner's manual step. That is the bootstrap, not a failed release.
          err=$(mktemp)
          if npm view "$name" version >/dev/null 2>"$err"; then
            rm -f "$err"
          elif grep -q 'E404' "$err"; then
            rm -f "$err"
            echo "::notice::'$name' is not on npm yet. The first publish cannot use OIDC, because npm only allows a trusted publisher on a package that already exists. The one-time manual bootstrap is in docs/release.md; after it, every version publishes here by itself. Nothing to do in CI."
            exit 0
          else
            cat "$err"
            rm -f "$err"
            echo "::error::could not read '$name' from the npm registry"
            exit 1
          fi

          npm publish --provenance --access public
