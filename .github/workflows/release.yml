name: release

# Publishes growthmap to npm with provenance, through npm trusted publishing (OIDC): no token is
# stored anywhere. The trusted publisher must name this repository and this workflow file.
# The first publish of the name cannot use OIDC (npm needs the package to exist first), so this
# job skips green and points at docs/release.md until the owner publishes once by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Two merges in a row must never publish at once; a queued run waits (no cancel).
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.0 or newer; the runner's bundled npm can be older.
      - name: Install a new enough npm
        run: |
          npm install -g npm@latest
          npm_version=$(npm -v)
          echo "npm $npm_version"
          if [ "$(printf '%s\n11.5.0\n' "$npm_version" | sort -V | head -n1)" != "11.5.0" ]; then
            echo "::error::npm $npm_version is older than 11.5.0, which trusted publishing needs"
            exit 1
          fi
      # No dependencies and no lockfile, so there is nothing to install.
      - name: Publish if this version is not on npm
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')

          if [ -n "$(npm view "$name@$version" version 2>/dev/null)" ]; then
            echo "$name@$version is already on npm; skipping publish"
            exit 0
          fi

          # A package must exist before a trusted publisher can be attached to it, so the very
          # first publish is the owner's manual step. That is the bootstrap, not a failed release.
          err=$(mktemp)
          if npm view "$name" version >/dev/null 2>"$err"; then
            rm -f "$err"
          elif grep -q 'E404' "$err"; then
            rm -f "$err"
            echo "::notice::'$name' is not on npm yet. The first publish cannot use OIDC, because npm only allows a trusted publisher on a package that already exists. The one-time manual bootstrap is in docs/release.md; after it, every version publishes here by itself. Nothing to do in CI."
            exit 0
          else
            cat "$err"
            rm -f "$err"
            echo "::error::could not read '$name' from the npm registry"
            exit 1
          fi

          npm publish --provenance --access public
